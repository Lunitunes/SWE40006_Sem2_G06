name: Monitoring CI

on:
  # Run by pipeline.yaml (pushes to main) and ci.yaml (pull requests). No triggers of its own:
  # those made it run a second time on every push and PR.
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check Prometheus config
        run: >
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" --entrypoint promtool
          prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml

      - name: Test alert rules
        run: >
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" -w /etc/prometheus --entrypoint promtool
          prom/prometheus:v3.5.0 test rules alerts.test.yml

      - name: Check Alertmanager config
        run: >
          docker run --rm -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro" --entrypoint amtool
          prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml

      - name: Check Grafana dashboard JSON
        run: jq empty monitoring/grafana/dashboards/*.json

      - name: Check compose files
        run: |
          docker compose -f compose.yaml -f compose.monitoring.yaml config --quiet
          docker compose -f compose.yaml -f compose.monitoring.yaml -f compose.desktop.yaml config --quiet
        env:
          GRAFANA_ADMIN_PASSWORD: ci-placeholder
          DB_PASSWORD: ci-placeholder
          ADMIN_PASSWORD: ci-placeholder
