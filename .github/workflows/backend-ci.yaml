name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Real PostgreSQL for the upload E2E tests (throwaway, so the credentials don't need to be secret)
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: photorepo_test
          POSTGRES_USER: photorepo
          POSTGRES_PASSWORD: photorepo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U photorepo -d photorepo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: photorepo_test
      DB_USER: photorepo
      DB_PASSWORD: photorepo

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Build backend
        run: pnpm run build

  build-images:
    name: Build Docker Images
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -t photo-backend:${{ github.sha }} \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t photo-frontend:${{ github.sha }} \
            ./frontend

      - name: Package Docker images
        run: |
          docker save \
            photo-backend:${{ github.sha }} \
            photo-frontend:${{ github.sha }} \
            | gzip > images.tar.gz

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-images
          path: images.tar.gz
          retention-days: 1
          if-no-files-found: error