name: Backend CI

on:
  # Run by pipeline.yaml (pushes to main) and ci.yaml (pull requests). No triggers of its own:
  # those made it run a second time on every push and PR.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    # Real PostgreSQL for the upload E2E tests (throwaway, so the credentials don't need to be secret)
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: photorepo_test
          POSTGRES_USER: photorepo
          POSTGRES_PASSWORD: photorepo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U photorepo -d photorepo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: photorepo_test
      DB_USER: photorepo
      DB_PASSWORD: photorepo

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Build backend
        run: pnpm run build

