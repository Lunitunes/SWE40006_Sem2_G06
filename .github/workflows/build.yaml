
name: Build Docker Images

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and Package Images
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build backend image
        run: |
          docker build \
            -t photo-backend:${{ github.sha }} \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t photo-frontend:${{ github.sha }} \
            ./frontend

      - name: Package Docker images
        run: |
          docker save \
            photo-backend:${{ github.sha }} \
            photo-frontend:${{ github.sha }} \
            | gzip > images.tar.gz

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v6
        with:
          name: deployment-images
          path: images.tar.gz
          retention-days: 1
          if-no-files-found: error
