
name: Build Docker Images

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Package Images
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -t ghcr.io/lunitunes/photo-backend:${{ github.sha }} \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t ghcr.io/lunitunes/photo-frontend:${{ github.sha }} \
            ./frontend

      - name: Push Docker images to GHCR
        run: |
          docker push ghcr.io/lunitunes/photo-backend:${{ github.sha }}
          docker push ghcr.io/lunitunes/photo-frontend:${{ github.sha }}
