name: E2E Tests

# End-to-end acceptance tests (brief: "end-to-end acceptance testing of a complete user journey"):
# start the whole app in fresh containers, then drive it in a real browser with Playwright
on:
  # Run by pipeline.yaml (pushes to main) and ci.yaml (pull requests). No triggers of its own:
  # those made it run a second time on every push and PR.
  workflow_call:
    inputs:
      use-built-images:
        description: >-
          Test the images from build.yaml (the exact ones that get deployed) instead of building
          them again. The pipeline sets this; pull requests build their own.
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    name: Browser tests (mobile + desktop)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      # Throwaway values for the test stack only
      DB_PASSWORD: e2e-ci-db-password
      ADMIN_PASSWORD: e2e-ci-host-password
      GRAFANA_ADMIN_PASSWORD: e2e-ci-grafana-password
      E2E_ADMIN_PASSWORD: e2e-ci-host-password
      BASE_URL: http://localhost:3000
      # App + monitoring, like production (the metrics page tests need Prometheus)
      COMPOSE: docker compose -f compose.yaml -f compose.monitoring.yaml

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # The committed webhook posts to the team's Discord; the test stack must not (its targets are
      # briefly "down" while booting, which would page everyone on every push)
      - name: Silence Discord alerts for the test stack
        run: printf 'http://127.0.0.1:9/discord-disabled-in-ci' > secrets/discord_webhook_url

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml

      - name: Log in to GHCR
        if: inputs.use-built-images
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Clean-slate containers every run (brief: < 1% flake rate), so failures mean real bugs.
      # Starting the app (building or loading its images) is the slowest part of this job and
      # doesn't depend on Playwright, so Playwright and Chromium are installed at the same time.
      - name: Start the app, and install Playwright (in parallel)
        env:
          USE_BUILT_IMAGES: ${{ inputs.use-built-images }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ "$USE_BUILT_IMAGES" = "true" ]; then
            start_app() {
              $COMPOSE -f compose.ci-images.yaml pull backend frontend
              $COMPOSE -f compose.ci-images.yaml up -d --no-build
            }
          else
            start_app() { $COMPOSE up -d --build; }
          fi
          start_app > compose-up.log 2>&1 &
          compose_pid=$!

          (cd e2e && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium)

          if ! wait "$compose_pid"; then
            echo "::error::Starting the app failed"
            cat compose-up.log
            exit 1
          fi
          tail -n 15 compose-up.log

      - name: Wait for the app to be ready
        run: |
          for attempt in $(seq 1 60); do
            # Backend + database + frontend serving, and Prometheus has scraped the backend at least once
            if curl -fsS -o /dev/null http://localhost:3001/health/ready \
              && curl -fsS -o /dev/null http://localhost:3000/ \
              && curl -fsS 'http://localhost:9090/api/v1/query?query=database_up' | grep -q '"1"\]'; then
              echo "App is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::App did not become ready"
          $COMPOSE logs --tail=80
          exit 1

      - name: Run E2E tests
        working-directory: e2e
        run: pnpm test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: App logs
        if: failure()
        run: $COMPOSE logs --tail=100 backend frontend prometheus

      - name: Stop the app
        if: always()
        run: $COMPOSE down -v
