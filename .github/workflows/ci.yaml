
name: CI

on:
  workflow_call:
    inputs:
      include-e2e:
        description: >-
          Run the Playwright suite here. The pipeline sets this to false and runs it separately,
          against the images it built for deployment.
        type: boolean
        default: true
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI
    uses: ./.github/workflows/backend-ci.yaml

  frontend:
    name: Frontend CI
    uses: ./.github/workflows/frontend-ci.yaml

  e2e:
    name: Playwright E2E
    # Pull requests have no inputs (null), so they always include it
    if: ${{ inputs.include-e2e != false }}
    uses: ./.github/workflows/e2e.yaml

  monitoring:
    name: Monitoring CI
    uses: ./.github/workflows/monitoring-ci.yaml
