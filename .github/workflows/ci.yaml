
name: CI

on:
  workflow_call:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI
    uses: ./.github/workflows/backend-ci.yaml

  frontend:
    name: Frontend CI
    uses: ./.github/workflows/frontend-ci.yaml

  e2e:
    name: Playwright E2E
    uses: ./.github/workflows/e2e.yaml

  monitoring:
    name: Monitoring CI
    uses: ./.github/workflows/monitoring-ci.yaml
