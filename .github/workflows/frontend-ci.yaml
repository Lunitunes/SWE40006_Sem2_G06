
name: Frontend CI

on:
  # Run by pipeline.yaml (pushes to main) and ci.yaml (pull requests). No triggers of its own:
  # those made it run a second time on every push and PR.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Validate Frontend
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm lint

      - name: Build frontend
        run: pnpm build
