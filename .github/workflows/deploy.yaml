
name: Deployment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: deployment-images

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Create environment file
        env:
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GRAFANA_ADMIN_USER: ${{ vars.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          umask 077
          cat > .env <<EOF
          DB_NAME=$DB_NAME
          DB_USER=$DB_USER
          DB_PASSWORD=$DB_PASSWORD
          ADMIN_PASSWORD=$ADMIN_PASSWORD
          GRAFANA_ADMIN_USER=$GRAFANA_ADMIN_USER
          GRAFANA_ADMIN_PASSWORD=$GRAFANA_ADMIN_PASSWORD
          PUBLIC_URL=$PUBLIC_URL
          SITE_ADDRESS=$SITE_ADDRESS
          DEPLOY_ENVIRONMENT=$DEPLOY_ENV
          GRAFANA_ADDRESS=grafana.$SITE_ADDRESS
          GRAFANA_ROOT_URL=https://grafana.$SITE_ADDRESS
          EOF

      - name: Transfer files to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "$EC2_USER@$EC2_HOST" \
            "mkdir -p ~/photo-repo"

          scp -i ~/.ssh/deploy_key -r \
            images.tar.gz \
            compose.production.yaml \
            compose.monitoring.yaml \
            .env monitoring secrets scripts caddy \
            "$EC2_USER@$EC2_HOST:~/photo-repo/"

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "$EC2_USER@$EC2_HOST" \
            "chmod 600 ~/photo-repo/.env && bash ~/photo-repo/scripts/deploy.sh '$GITHUB_SHA'"

      - name: Cleanup
        if: always()
        run: rm -f .env ~/.ssh/deploy_key
