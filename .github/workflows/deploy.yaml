
name: Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t photo-backend:${{ github.sha }} \
            ./backend

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t photo-frontend:${{ github.sha }} \
            ./frontend
