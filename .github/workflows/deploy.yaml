
name: Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -t photo-backend:${{ github.sha }} \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t photo-frontend:${{ github.sha }} \
            ./frontend

      - name: Package Docker images
        run: |
          docker save \
            photo-backend:${{ github.sha }} \
            photo-frontend:${{ github.sha }} \
            | gzip > images.tar.gz

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-images
          path: images.tar.gz
          retention-days: 1
          if-no-files-found: error
