services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-photorepo}
      DB_USER: ${DB_USER:-photorepo}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      # Host login for /host (creating events) and /admin/metrics
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      # The browser calls /api/backend/... on the frontend, which forwards to this address
      BACKEND_URL: http://backend:3001
      # Public address the /share QR code points to (e.g. https://photos.example.com); blank = the address in the browser
      PUBLIC_URL: ${PUBLIC_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-photorepo}
      POSTGRES_USER: ${DB_USER:-photorepo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      # Named volume: photos survive container rebuilds and redeploys
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
