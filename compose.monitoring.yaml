# Production monitoring stack. Layer it on top of the app:
#   docker compose -f compose.yaml -f compose.monitoring.yaml up -d
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    # Bound to localhost: no auth, so reach it over an SSH tunnel rather than the public internet
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - alertmanager
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # Single instance: turn off clustering (HA gossip), which otherwise crash-loops when the
      # container's network address isn't in a private range ("No private IP address found")
      - --cluster.listen-address=
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
      # Discord webhook URL (secrets/discord_webhook_url, committed; see .gitignore). Mounted outside
      # /etc/alertmanager because that's a read-only mount, so Docker can't create a folder inside it
      - ./secrets:/etc/alertmanager-secrets:ro
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  # Host CPU, memory, disk and network metrics. Needs a Linux host (e.g. the EC2 instance);
  # the rslave mount is not supported by Docker Desktop on Windows/macOS.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 15s
      # Grafana's own links and login redirects use this; on EC2 it's https://grafana.<site>
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3002}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/production-overview.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # 3000 and 3001 are taken by the frontend and backend
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # Lets the app's /admin/metrics page query Prometheus server-side
  frontend:
    environment:
      PROMETHEUS_URL: http://prometheus:9090

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
