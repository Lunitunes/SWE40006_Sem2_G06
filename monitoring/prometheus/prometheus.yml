global:
  # Success metric: production metrics refresh every 15 seconds
  scrape_interval: 15s
  # Short timeout so a hung backend is marked down quickly (feeds the 30s alert target)
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # NestJS backend: HTTP request rate/latency/status codes + Node.js process CPU/memory
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:3001']

  # Host metrics: CPU, RAM, disk usage, disk I/O, network traffic
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
