
services:
  backend:
    image: photo-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-photorepo}
      DB_USER: ${DB_USER:-photorepo}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # Host login for /host (creating events) and /admin/metrics
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: photo-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      BACKEND_URL: http://backend:3001
      # Address the event QR codes point to (e.g. http://<ec2-public-ip>:3000); blank = the browser's address
      PUBLIC_URL: ${PUBLIC_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # HTTPS front door: gets and renews a Let's Encrypt certificate for SITE_ADDRESS and forwards
  # to the frontend. HTTPS is what lets browsers use the in-page camera. See caddy/Caddyfile.
  # Port 3000 above stays published so the site keeps working before 80/443 are opened; close
  # 3000 in the EC2 security group once HTTPS works.
  caddy:
    image: caddy:2.10.2-alpine
    environment:
      # e.g. 13-239-43-240.sslip.io; blank = plain HTTP on port 80, no certificate
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Keeps the certificate across deploys (Let's Encrypt limits how often one can be re-issued)
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    restart: unless-stopped

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-photorepo}
      POSTGRES_USER: ${DB_USER:-photorepo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
